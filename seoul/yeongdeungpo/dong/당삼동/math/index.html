<body>
<p>페이지 주소가 변경되었습니다. <a href="https://wcoachingcenter.com/seoul/yeongdeungpo/dong/당산동/math/">이동하기</a></p>
<!-- WAWA_AUTO_PROTECT_START -->
<script>
(function(){
  // 우클릭 차단 (폼 입력칸은 허용 — 붙여넣기 등 정상 사용 보존)
  document.addEventListener('contextmenu', function(e){
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
  }, false);
  // F12 / 개발자도구·소스보기 단축키 차단
  document.addEventListener('keydown', function(e){
    var k = e.keyCode || e.which;
    if (k === 123) { e.preventDefault(); return false; }
    if (e.ctrlKey && e.shiftKey && (k === 73 || k === 74 || k === 67)) { e.preventDefault(); return false; }
    if (e.ctrlKey && k === 85) { e.preventDefault(); return false; }
  }, false);
  // 드래그·텍스트 선택 차단 (폼 입력칸은 허용)
  document.addEventListener('dragstart', function(e){ e.preventDefault(); });
  document.addEventListener('selectstart', function(e){
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
  }, false);
})();
</script>
<style>body{-webkit-user-select:none;-moz-user-select:none;user-select:none}input,textarea,select{-webkit-user-select:text;-moz-user-select:text;user-select:text}img{-webkit-user-drag:none}</style>
<!-- WAWA_AUTO_PROTECT_END -->
</body>
